allowBuilds:
  "@prisma/client": true
  "@prisma/engines": true
  "@tailwindcss/oxide": true
  bcryptjs: true
  esbuild: true
  prisma: true
  sharp: true
  unrs-resolver: true
  workerd: true

# Security overrides (pnpm audit): same-major bumps only, dev-tooling transitive deps.
overrides:
  valibot@<1.4.2: ">=1.4.2"
  lodash@<4.18.1: ">=4.18.1"
  mysql2@<3.23.1: ">=3.23.1"
  braces@<3.0.3: ">=3.0.3"
  deepmerge-ts@<8.0.0: ">=8.0.0"
